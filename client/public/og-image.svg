  </text>
  <text x="84" y="350" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-0.035em">
    for <tspan fill="#38bdf8">high-velocity</tspan> engineering.
  </text>

  <!-- Subtitle -->
  <text x="84" y="420" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" letter-spacing="-0.01em">
    AI-driven technical skill assessments, dynamic roadmaps, and sandboxed runtimes.
  </text>

  <!-- Feature Badges -->
  <g transform="translate(84, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="290" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="26" cy="26" r="6" fill="#10b981"/>
    <text x="44" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Autonomous Skill Benchmarking</text>

    <!-- Badge 2 -->
    <rect x="310" y="0" width="240" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="336" cy="26" r="6" fill="#38bdf8"/>
    <text x="354" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Dynamic Pathways</text>

    <!-- Badge 3 -->
    <rect x="570" y="0" width="250" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="596" cy="26" r="6" fill="#a855f7"/>
    <text x="614" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Browser Sandboxed IDE</text>
  </g>

  <!-- Domain -->
  <text x="1116" y="565" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="end" letter-spacing="0.02em">
