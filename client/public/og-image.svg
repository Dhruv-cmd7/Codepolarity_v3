<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="250" cy="200" r="400" fill="url(#glow-cyan)"/>
  <circle cx="1000" cy="500" r="350" fill="url(#glow-blue)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Logo Mark Graphic -->
  <g transform="translate(84, 80) scale(0.24)">
    <circle cx="192" cy="192" r="192" fill="#000000" stroke="#38bdf8" stroke-width="8"/>
    <path fill="#ffffff" d="M101.59,225.35A43.63,43.63,0,0,1,110,208.83a49.23,49.23,0,0,1,17.37-14.65,41.15,41.15,0,0,1,18.3-4.23c7,0,13.43.47,20,3.29a43.12,43.12,0,0,1,17.46,14.55c4.51,6.2,8.74,13.8,8.74,21.6v52H100.74V256.71c0-7.14-.37-14.27-.28-21.41A39.2,39.2,0,0,1,101.59,225.35Z"/>
    <path fill="#ffffff" d="M280.72,158.88a43.7,43.7,0,0,1-8.45,16.52,50.54,50.54,0,0,1-17.37,14.74,41.15,41.15,0,0,1-18.3,4.23c-7,0-13.43-.47-20-3.29a43.12,43.12,0,0,1-17.46-14.55c-4.51-6.2-8.74-13.8-8.74-21.6v-52.1h91.17v24.69c0,7.13.37,14.27.28,21.41A39.73,39.73,0,0,1,280.72,158.88Z"/>
    <path fill="#ffffff" d="M152.1,100c4.88.56,9.86,2.82,14.17,5.07,12.12,6.29,21.22,16.9,23.85,30.51a53.22,53.22,0,0,1,.85,7.61v48.16H99.8V99.92h49.29A16.17,16.17,0,0,1,152.1,100Z"/>
    <path fill="#ffffff" d="M230.21,284c-4.88-.47-9.86-2.72-14.17-5-12.12-6.19-21.32-16.8-23.95-30.42a51.67,51.67,0,0,1-.84-7.6L191,192.86l91.16-.56.57,91.54-30.42.19-18.88.09C232.28,284.12,231.24,284.12,230.21,284Z"/>
  </g>

  <!-- Brand Name -->
  <text x="200" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.03em">
    Codepolarity
  </text>

  <!-- Tagline Pill -->
  <rect x="440" y="112" width="230" height="38" rx="19" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
  <text x="555" y="136" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.05em">
    CAREER ENGINE
  </text>

  <!-- Main Headline -->
  <text x="84" y="280" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-0.035em">
